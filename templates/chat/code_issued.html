{% extends "base.html" %}
{% load static %}
{% block title %}{{ action_label }}{% endblock %}
{% block body %}
<main class="issued-page">
  <section class="issued-card">
    <div class="success-symbol">✓</div>
    <p class="section-kicker">CHAT ROOM READY</p>
    <h1>{{ action_label }}</h1>
    <p class="lead">聊天室“{{ room.name }}”可以通过以下授权码进入。</p>
    <div class="one-time-warning"><span>!</span><div><strong>请通过可信渠道发送授权码</strong><p>管理员之后仍可在聊天室管理页面查看完整授权码。</p></div></div>
    <div class="issued-list">
      <div class="issued-code-row">
        <div><span>聊天室授权码</span><code id="issued-chat-code">{{ plain_code }}</code></div>
        <button id="copy-chat-code" class="copy-one" type="button">复制</button>
      </div>
    </div>
    <p id="copy-feedback" class="copy-feedback" aria-live="polite"></p>
    <div class="issued-actions">
      <a class="button button-primary" href="{% url 'chat:manage' %}">返回聊天室管理</a>
      <a class="button" href="{% url 'videos:access' %}">打开统一访问入口</a>
    </div>
  </section>
</main>
<script src="{% static 'js/clipboard.js' %}"></script>
<script>
document.getElementById("copy-chat-code").addEventListener("click", async () => {
  const value = document.getElementById("issued-chat-code").textContent.trim();
  const feedback = document.getElementById("copy-feedback");
  try {
    await window.copyTextWithFallback(value);
    feedback.textContent = "授权码已复制。";
  } catch (_error) {
    feedback.textContent = "复制失败，请手工选择授权码。";
  }
});
</script>
{% endblock %}
